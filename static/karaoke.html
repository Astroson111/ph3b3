<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ph3b3 Karaoke</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0a0318;
  --bg2:      #0d0525;
  --violet:   #6B3FA0;
  --violet-l: #a855f7;
  --magenta:  #E0408A;
  --dim:      #2d1060;
  --dim2:     #4a2d80;
  --rim:      #3d1f7a;
  --text:     #e0d4ff;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100dvh;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ════════════════════════════════════════════════════════
   HEADER
   ════════════════════════════════════════════════════════ */
#lib-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: var(--bg2);
  border-bottom: 1px solid var(--rim);
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 5;
}
#lib-header .logo { font-size: 1.5rem; color: var(--violet-l); flex-shrink: 0; }
#lib-header h1 {
  font-size: clamp(1rem, 3vw, 1.3rem);
  font-weight: 600;
  flex: 1;
  white-space: nowrap;
}
#search {
  background: #1a0a38;
  border: 1px solid var(--rim);
  border-radius: 8px;
  color: var(--text);
  padding: 8px 12px;
  font-size: 0.9rem;
  flex: 1;
  min-width: 120px;
  max-width: 280px;
  outline: none;
}
#search::placeholder { color: var(--dim2); }
#search:focus { border-color: var(--violet-l); }
.btn-tv {
  background: #1a0a38;
  border: 1px solid var(--rim);
  border-radius: 8px;
  color: var(--dim2);
  font-size: 1.1rem;
  padding: 7px 12px;
  cursor: pointer;
  text-decoration: none;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.btn-tv:hover { color: var(--violet-l); border-color: var(--violet-l); }

/* ════════════════════════════════════════════════════════
   NOW PLAYING PANEL — prominent, always on page
   ════════════════════════════════════════════════════════ */
#now-playing {
  background: var(--bg2);
  border-bottom: 2px solid var(--violet);
  padding: 28px 24px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  min-height: 160px;
  position: relative;
  overflow: visible;
}

#now-playing::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 60%,
    rgba(107,63,160,.12) 0%, transparent 70%);
  pointer-events: none;
}

/* ── idle placeholder ── */
#np-idle {
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--dim2);
  font-size: clamp(1rem, 2.5vw, 1.2rem);
}
#np-idle .idle-moon {
  font-size: 2.5rem;
  line-height: 1;
  opacity: .5;
}

/* ── active player ── */
#np-active {
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

#np-info { text-align: center; }
#np-title {
  font-size: clamp(1.1rem, 3vw, 1.8rem);
  font-weight: 700;
  color: var(--text);
}
#np-artist {
  font-size: .9rem;
  color: var(--dim2);
  margin-top: 3px;
}

/* ── lyric lines inside panel ── */
#np-lyrics {
  width: 100%;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.lyr {
  width: 100%;
  text-align: center;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 4px;
}
#lyr-prev, #lyr-next {
  font-size: clamp(.9rem, 2.2vw, 1.8rem);
  color: var(--dim2);
  min-height: 1.3em;
}
#lyr-curr {
  font-size: clamp(1.5rem, 4.5vw, 3.8rem);
  font-weight: 700;
  color: var(--magenta);
  text-shadow: 0 0 50px rgba(224,64,138,.3);
  letter-spacing: .02em;
  min-height: 1.3em;
  display: inline-block;
}
/* Shrink active line to text width so moon tracks the text, not the container */
#lyr-curr:not(.lyr-idle) {
  width: fit-content;
  max-width: 100%;
}
.lyr-idle {
  font-size: clamp(1rem, 2.5vw, 2rem) !important;
  font-weight: 300 !important;
  color: var(--dim2) !important;
  text-shadow: none !important;
}

/* ── transport controls ── */
#np-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 560px;
}
.ctrl-btn {
  background: transparent;
  border: 1px solid var(--rim);
  border-radius: 8px;
  color: var(--violet-l);
  font-size: clamp(.9rem, 2vw, 1.1rem);
  padding: 7px 13px;
  cursor: pointer;
  min-width: 42px;
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .12s;
  flex-shrink: 0;
}
.ctrl-btn:hover  { background: var(--rim); }
.ctrl-btn:active { background: var(--violet); }

#prog-wrap {
  flex: 1;
  height: 5px;
  background: #1a0a38;
  border-radius: 3px;
  cursor: pointer;
  position: relative;
}
#prog-fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  background: linear-gradient(90deg, var(--violet), var(--magenta));
  border-radius: 3px;
  pointer-events: none;
}
#prog-thumb {
  position: absolute;
  width: 13px; height: 13px;
  background: var(--magenta);
  border-radius: 50%;
  top: 50%; left: 0%;
  transform: translate(-50%,-50%);
  pointer-events: none;
  box-shadow: 0 0 0 0 rgba(224,64,138,.4);
  transition: box-shadow .15s;
}
#prog-wrap:hover #prog-thumb { box-shadow: 0 0 0 5px rgba(224,64,138,.3); }

#time-disp {
  font-size: clamp(.7rem, 1.5vw, .85rem);
  color: var(--dim2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  min-width: 9ch;
  text-align: right;
  flex-shrink: 0;
}

/* ════════════════════════════════════════════════════════
   LIBRARY
   ════════════════════════════════════════════════════════ */
#track-grid {
  padding: 24px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  align-content: start;
}

.track-card {
  background: #110630;
  border: 1px solid var(--rim);
  border-radius: 14px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color .15s, background .15s;
}
.track-card:hover { border-color: var(--violet); background: #160840; }

.card-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.card-moon { font-size: 1.8rem; line-height: 1; flex-shrink: 0; }
.card-meta { flex: 1; min-width: 0; }
.card-title {
  font-size: clamp(.95rem, 2.5vw, 1.1rem);
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-artist {
  font-size: .85rem;
  color: var(--dim2);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-dur {
  font-size: .8rem;
  color: var(--dim2);
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}
.card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge {
  font-size: .7rem;
  padding: 2px 7px;
  border-radius: 99px;
  border: 1px solid;
}
.badge-cc  { color: #6ee7b7; border-color: #064e3b; background: #022c22; }
.badge-lrc { color: #c4b5fd; border-color: #4c1d95; background: #1e0a40; }

/* THE PLAY BUTTON — always shown, always enabled, every track */
.btn-play {
  width: 100%;
  padding: 15px;
  font-size: clamp(1rem, 2.5vw, 1.15rem);
  font-weight: 700;
  background: linear-gradient(135deg, #6B3FA0, #E0408A);
  border: none;
  border-radius: 10px;
  color: #fff;
  cursor: pointer;
  letter-spacing: .05em;
  transition: opacity .15s, transform .1s;
}
.btn-play:active { transform: scale(.97); opacity: .85; }

/* ════════════════════════════════════════════════════════
   DISCOVER PANEL
   ════════════════════════════════════════════════════════ */
#discover-panel {
  background: var(--bg2);
  border-bottom: 1px solid var(--rim);
  padding: 16px 20px;
}
#disc-search-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
#disc-query {
  flex: 1;
  min-width: 180px;
  background: #1a0a38;
  border: 1px solid var(--rim);
  border-radius: 8px;
  color: var(--text);
  padding: 8px 12px;
  font-size: .9rem;
  outline: none;
}
#disc-query:focus { border-color: var(--violet-l); }
#disc-go {
  background: var(--violet);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: .9rem;
  font-weight: 600;
  padding: 8px 18px;
  cursor: pointer;
  white-space: nowrap;
}
#disc-go:hover { background: var(--violet-l); }
#disc-results {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.disc-msg {
  color: var(--dim2);
  font-size: .9rem;
  grid-column: 1 / -1;
  text-align: center;
  padding: 12px 0;
}
.disc-card {
  background: #110630;
  border: 1px solid var(--rim);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.disc-title {
  font-size: .95rem;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.disc-meta {
  font-size: .8rem;
  color: var(--dim2);
}
.btn-pull {
  width: 100%;
  padding: 10px;
  font-size: .9rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--violet), var(--magenta));
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  transition: opacity .15s;
  margin-top: auto;
}
.btn-pull:disabled { opacity: .4; cursor: not-allowed; }

/* ════════════════════════════════════════════════════════
   MOON — fixed overlay
   ════════════════════════════════════════════════════════ */
#moon {
  position: fixed;
  top: 0; left: 0;
  width: 48px; height: 48px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 63% 32%, var(--bg) 37%, transparent 38%),
    #a855f7;
  filter:
    drop-shadow(0 0 10px #a855f7)
    drop-shadow(0 0 28px #7c3aed88);
  pointer-events: none;
  will-change: transform;
  z-index: 40;
  opacity: 0;
  transition: opacity .2s;
}

/* ════════════════════════════════════════════════════════
   PEACH — protected fixture, bottom-right corner
   ════════════════════════════════════════════════════════ */
#peach-k {
  position: fixed;
  bottom: 18px;
  right: 18px;
  width: 96px;
  height: auto;
  opacity: 0.45;
  pointer-events: none;
  transition: opacity .3s ease;
  transform-origin: bottom center;
  z-index: 15;
}
#peach-k.bark { animation: peachBark .6s ease; opacity: .9; }
@keyframes peachBark {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.18) translateY(-6px); }
  55%  { transform: scale(1.05); }
  100% { transform: scale(1); }
}
#btn-bark {
  position: fixed;
  bottom: 122px;
  right: 22px;
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  opacity: 0.4;
  transition: opacity .2s;
  z-index: 16;
  padding: 4px;
  line-height: 1;
}
#btn-bark:hover { opacity: 0.85; }
#btn-bark.active { opacity: 0.9; }

/* ════════════════════════════════════════════════════════
   TV WAITING SCREEN
   ════════════════════════════════════════════════════════ */
#view-tv {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: var(--bg);
  align-items: center;
  justify-content: center;
  text-align: center;
}
#tv-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 40px;
}
#tv-moon {
  width: 120px; height: 120px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 63% 32%, var(--bg) 37%, transparent 38%),
    #a855f7;
  filter:
    drop-shadow(0 0 20px #a855f7)
    drop-shadow(0 0 60px #7c3aed);
  animation: tv-pulse 3s ease-in-out infinite;
}
@keyframes tv-pulse {
  0%,100% { filter: drop-shadow(0 0 20px #a855f7) drop-shadow(0 0 60px #7c3aed); }
  50%      { filter: drop-shadow(0 0 35px #a855f7) drop-shadow(0 0 100px #7c3aed); }
}
#tv-inner h1 { font-size: clamp(2rem, 5vw, 4rem); font-weight: 700; color: var(--violet-l); letter-spacing: .05em; }
#tv-status  { font-size: clamp(1rem, 2.5vw, 1.8rem); color: var(--dim2); }
#tv-hint    { font-size: clamp(.75rem, 1.5vw, 1rem); color: var(--dim); margin-top: 8px; }
#tv-activate {
  margin-top: 16px; padding: 12px 28px;
  background: var(--violet); border: none; border-radius: 10px;
  color: var(--text); font-size: 1rem; cursor: pointer;
}

#np-active { padding: 40px 24px; }
#btn-back  { align-self: flex-start; margin-bottom: 8px; }

/* ════════════════════════════════════════════════════════
   MOBILE
   ════════════════════════════════════════════════════════ */
@media (max-width: 520px) {
  #track-grid { grid-template-columns: 1fr; padding: 16px; gap: 12px; }
  #lib-header { padding: 10px 14px; gap: 8px; }
  #lib-header h1 { font-size: 1rem; }
  #search { max-width: none; }
  #now-playing { padding: 20px 16px 16px; }
  #lyr-curr { white-space: normal; word-break: break-word; }
}
</style>
</head>
<body>

<!-- ═══ MAIN PAGE ════════════════════════════════════════════════════════════ -->
<div id="view-main">

  <header id="lib-header">
    <span class="logo">☽</span>
    <h1>Ph3b3 Karaoke</h1>
    <input type="search" id="search" placeholder="Search tracks…"
           autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn-tv" id="btn-disc" title="Discover tracks on Jamendo">🔍 Discover</button>
    <a href="?tv" target="_blank" class="btn-tv" title="Open TV display">📺 TV</a>
  </header>

  <!-- ── DISCOVER PANEL ──────────────────────────────────────────────── -->
  <div id="discover-panel" style="display:none">
    <div id="disc-search-bar">
      <input id="disc-query" type="search" placeholder="Search Jamendo (e.g. lofi, jazz, pop)…"
             autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="disc-go">Search</button>
    </div>
    <div id="disc-results"><div class="disc-msg">Enter a search term above and hit Search</div></div>
  </div>

  <!-- ── NOW PLAYING PANEL ──────────────────────────────────────────────── -->
  <section id="now-playing">
    <!-- Idle: shown when nothing is loaded -->
    <div id="np-idle">
      <span class="idle-moon">☽</span>
      <span>Tap <strong>▶ PLAY</strong> on any track below</span>
    </div>

  </section>

  <!-- ── LIBRARY ────────────────────────────────────────────────────────── -->
  <div id="track-grid"></div>

</div><!-- #view-main -->

<!-- ═══ TV WAITING SCREEN ════════════════════════════════════════════════════ -->
<div id="view-tv">
  <div id="tv-inner">
    <div id="tv-moon"></div>
    <h1>Ph3b3 Karaoke</h1>
    <p id="tv-status">Waiting for track…</p>
    <p id="tv-hint">Open <strong id="tv-url"></strong> on your phone</p>
    <button id="tv-activate">Tap to activate audio</button>
  </div>

  <!-- Active player — lives here so view-tv covers the screen during playback -->
  <div id="np-active" style="display:none">
    <button class="ctrl-btn" id="btn-back" title="Back to library">← Back</button>
    <div id="np-info">
      <div id="np-title">—</div>
      <div id="np-artist"></div>
    </div>
    <div id="np-lyrics" style="display:none">
      <div class="lyr" id="lyr-prev"></div>
      <div class="lyr" id="lyr-curr"></div>
      <div class="lyr" id="lyr-next"></div>
    </div>
    <div id="np-controls">
      <button class="ctrl-btn" id="btn-rst"  title="Restart">↺</button>
      <button class="ctrl-btn" id="btn-play" title="Play / Pause">▶</button>
      <div id="prog-wrap">
        <div id="prog-fill"></div>
        <div id="prog-thumb"></div>
      </div>
      <span id="time-disp">0:00 / 0:00</span>
      <button class="ctrl-btn" id="btn-exit" title="Stop">✕</button>
    </div>
  </div>
</div>

<!-- ═══ MOON (fixed, floats above everything) ════════════════════════════════ -->
<div id="moon"></div>
<img id="peach-k" src="peach_karaoke.png" alt="Peach">
<button id="btn-bark" title="Toggle bark sound">🔕</button>

<audio id="audio" preload="auto"></audio>

<script>
// ── DOM refs ──────────────────────────────────────────────────────────────
const audio     = document.getElementById('audio');
const moon      = document.getElementById('moon');
const npIdle    = document.getElementById('np-idle');
const npActive  = document.getElementById('np-active');
const npLyrics  = document.getElementById('np-lyrics');
const npTitle   = document.getElementById('np-title');
const npArtist  = document.getElementById('np-artist');
const lyrPrev   = document.getElementById('lyr-prev');
const lyrCurr   = document.getElementById('lyr-curr');
const lyrNext   = document.getElementById('lyr-next');
const progFill  = document.getElementById('prog-fill');
const progThumb = document.getElementById('prog-thumb');
const timeDisp  = document.getElementById('time-disp');
const btnPlay   = document.getElementById('btn-play');
const btnRst    = document.getElementById('btn-rst');
const btnExit   = document.getElementById('btn-exit');
const progWrap  = document.getElementById('prog-wrap');
const viewMain  = document.getElementById('view-main');
const viewTv    = document.getElementById('view-tv');
const tvInner   = document.getElementById('tv-inner');
const searchEl  = document.getElementById('search');
const btnBack   = document.getElementById('btn-back');
const peachK    = document.getElementById('peach-k');
const btnBark   = document.getElementById('btn-bark');
let   barkEnabled = false;

btnBark.addEventListener('click', () => {
  barkEnabled = !barkEnabled;
  btnBark.textContent = barkEnabled ? '🔔' : '🔕';
  btnBark.classList.toggle('active', barkEnabled);
});

function playBark() {
  const ctx  = new (window.AudioContext || window.webkitAudioContext)();
  const buf  = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1);

  const src    = ctx.createBufferSource();
  src.buffer   = buf;

  const filter = ctx.createBiquadFilter();
  filter.type  = 'bandpass';
  filter.frequency.setValueAtTime(1200, ctx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.22);
  filter.Q.value = 1.8;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);

  src.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  src.start();
  src.stop(ctx.currentTime + 0.25);
  src.onended = () => ctx.close();
}
const btnDisc   = document.getElementById('btn-disc');
const discPanel = document.getElementById('discover-panel');
const discRes   = document.getElementById('disc-results');
const discQuery = document.getElementById('disc-query');

// ── Mode detection ────────────────────────────────────────────────────────
const TV_MODE = new URLSearchParams(location.search).has('tv');

// ── State ─────────────────────────────────────────────────────────────────
let lines      = [];
let curIdx     = -1;
let moonActive = false;
let seeking    = false;
let hasLRC     = false;
let endRevertTimer;

// ── LRC parser ────────────────────────────────────────────────────────────
function parseLRC(raw) {
  const re  = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/g;
  const out = [];
  let m;
  while ((m = re.exec(raw)) !== null) {
    const ms = m[3].length === 3 ? parseInt(m[3]) : parseInt(m[3]) * 10;
    const t  = parseInt(m[1]) * 60 + parseInt(m[2]) + ms / 1000;
    out.push({ time: t, text: m[4].trim() });
  }
  return out.sort((a, b) => a.time - b.time);
}

// ── Helpers ───────────────────────────────────────────────────────────────
const fmt = s =>
  `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

const humanize = s =>
  s.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

function isSpacer(t) { return !t || /^[♪(]/.test(t); }

function activeIdx(t) {
  let lo = 0, hi = lines.length - 1, idx = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (lines[mid].time <= t) { idx = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  return idx;
}

// ── Animation loop ────────────────────────────────────────────────────────
function tick() {
  requestAnimationFrame(tick);

  const playing = !audio.paused && !!audio.src;
  const t       = audio.currentTime || 0;
  const dur     = audio.duration    || 0;

  // Progress bar (when a track is loaded)
  if (dur > 0 && !seeking) {
    const pct = (t / dur * 100).toFixed(2) + '%';
    progFill.style.width = pct;
    progThumb.style.left = pct;
  }
  timeDisp.textContent = `${fmt(t)} / ${fmt(dur || 0)}`;

  // Nothing to do if no LRC or not playing
  if (!hasLRC || !lines.length) {
    moon.style.opacity = '0';
    return;
  }

  // Line change
  const idx = activeIdx(t);
  if (idx !== curIdx) {
    curIdx = idx;
    const curr = idx >= 0 ? lines[idx].text   : '';
    const prev = idx >  0 ? lines[idx-1].text : '';
    const next = idx + 1 < lines.length ? lines[idx+1].text : '';

    lyrPrev.textContent = isSpacer(prev) ? '' : prev;
    lyrNext.textContent = isSpacer(next) ? '' : next;

    moonActive = idx >= 0 && !isSpacer(curr);

    if (moonActive) {
      lyrCurr.className   = 'lyr';
      lyrCurr.textContent = curr;
    } else {
      lyrCurr.className   = 'lyr lyr-idle';
      lyrCurr.textContent = curr || '♪';
      moon.style.opacity  = '0';
    }
  }

  if (!moonActive || !playing) {
    if (!playing) moon.style.opacity = '0';
    return;
  }

  // ── Moon bounce across current lyric line ─────────────────────────────
  const lineStart = lines[curIdx].time;
  const lineEnd   = curIdx + 1 < lines.length ? lines[curIdx + 1].time : lineStart + 6;
  const progress  = Math.min(1, Math.max(0, (t - lineStart) / (lineEnd - lineStart)));

  const textRect = lyrCurr.getBoundingClientRect();
  if (textRect.width === 0) return;

  const mW = 48, mH = 48;
  const xL = textRect.left;
  const xR = textRect.right - mW;
  const moonX = xL + progress * (xR - xL);

  // ~1.5 arcs per line, 72px amplitude, baseline 20px above text
  const bounce   = Math.abs(Math.sin(progress * Math.PI * 1.5));
  const baseline = textRect.top - mH - 20;
  const moonY    = baseline - bounce * 72;

  moon.style.transform = `translate(${moonX.toFixed(1)}px,${moonY.toFixed(1)}px)`;
  moon.style.opacity   = '1';
}

// ── Play a track — called directly from click handler ────────────────────
// audio.src + audio.play() are set synchronously BEFORE any await so the
// browser still counts this as a user-gesture-initiated play.
function startAudio(name) {
  audio.src = `/karaoke/audio/${encodeURIComponent(name)}`;
  audio.play().catch(() => {});
  btnPlay.textContent = '⏸';
}

async function loadLRC(name) {
  try {
    const url = `/karaoke/lrc/${encodeURIComponent(name)}`;
    const r = await fetch(url);
    console.log('[DBG] loadLRC', url, '→', r.status, r.ok);
    if (!r.ok) return;
    const { text } = await r.json();
    lines = parseLRC(text);
    console.log('[DBG] parseLRC lines:', lines.length);
  } catch(e) { console.error('[DBG] loadLRC error', e); }

  console.log('[DBG] lines.length after try:', lines.length, '| hasLRC before set:', hasLRC);
  if (!lines.length) return;

  npLyrics.style.display = 'flex';
  hasLRC = true;
  console.log('[DBG] hasLRC set true, npLyrics.display:', npLyrics.style.display);
  curIdx = -1;

  const i = Math.max(0, activeIdx(audio.currentTime));
  lyrCurr.className   = 'lyr';
  lyrCurr.textContent = lines[i]?.text || lines[0].text;
  lyrNext.textContent = lines[i + 1]?.text || '';
  curIdx = i;
}

// ── Library ───────────────────────────────────────────────────────────────
function buildCard(t) {
  const attr   = t.attribution;
  const title  = attr?.track_name  || humanize(t.name);
  const artist = attr?.artist_name || '';
  const dur    = t.duration_s > 0
    ? `${Math.floor(t.duration_s / 60)}:${String(Math.floor(t.duration_s % 60)).padStart(2, '0')}`
    : '';

  const card = document.createElement('div');
  card.className       = 'track-card';
  card.dataset.search  = (title + ' ' + artist).toLowerCase();

  card.innerHTML = `
    <div class="card-top">
      <div class="card-moon">☽</div>
      <div class="card-meta">
        <div class="card-title">${title}</div>
        ${artist ? `<div class="card-artist">${artist}</div>` : ''}
        ${dur    ? `<div class="card-dur">${dur}</div>`       : ''}
      </div>
    </div>
    <div class="card-badges">
      ${attr?.license_cc_url ? `<span class="badge badge-cc">CC</span>` : ''}
      ${t.lrc_exists         ? `<span class="badge badge-lrc">♪ lyrics</span>` : ''}
    </div>
    <button class="btn-play">▶ &nbsp;PLAY</button>
  `;

  // Click handler: synchronously start audio (preserves user-gesture chain),
  // then asynchronously load LRC if available.
  card.querySelector('.btn-play').addEventListener('click', () => {
    clearTimeout(endRevertTimer);
    // Reset state
    lines      = [];
    curIdx     = -1;
    hasLRC     = false;
    moon.style.opacity = '0';

    // Show panel immediately
    npIdle.style.display   = 'none';
    npActive.style.display = 'flex';
    npLyrics.style.display = 'flex';
    npTitle.textContent  = title;
    npArtist.textContent = artist;
    lyrPrev.textContent  = '';
    lyrCurr.className    = 'lyr lyr-idle';
    lyrCurr.textContent  = '♪';
    lyrNext.textContent  = '';

    // Start audio NOW — within the user gesture, before any await
    startAudio(t.name);

    // Always attempt LRC (handles stale lrc_exists; 404 → silent, ♪ stays)
    loadLRC(t.name);

    // Notify TV display (fire-and-forget)
    fetch('/karaoke/now', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ track: t.name, playing: true })
    }).catch(() => {});

    viewMain.style.display = 'none';
    tvInner.style.display  = 'none';
    npActive.style.display = 'flex';
    viewTv.style.display   = 'flex';
    console.log('[DBG] #np-lyrics display:', npLyrics.style.display);
  });

  return card;
}

async function initLibrary() {
  const grid = document.getElementById('track-grid');
  try {
    const r = await fetch('/karaoke/library');
    if (!r.ok) return;
    const { tracks } = await r.json();

    // LRC tracks first, then non-LRC
    const sorted = [
      ...tracks.filter(t =>  t.lrc_exists),
      ...tracks.filter(t => !t.lrc_exists),
    ];
    for (const t of sorted) grid.appendChild(buildCard(t));
  } catch (e) { console.error('[karaoke] initLibrary:', e); }
}

searchEl.addEventListener('input', () => {
  const q = searchEl.value.toLowerCase().trim();
  document.querySelectorAll('.track-card').forEach(card => {
    card.style.display = (!q || card.dataset.search.includes(q)) ? '' : 'none';
  });
});

// ── Player controls ────────────────────────────────────────────────────────
btnPlay.addEventListener('click', () => {
  if (!audio.src || audio.src === location.href) return;
  if (audio.paused) { audio.play().catch(() => {}); btnPlay.textContent = '⏸'; }
  else              { audio.pause(); btnPlay.textContent = '▶'; }
});

btnRst.addEventListener('click', () => {
  audio.currentTime = 0;
  curIdx = -1;
  audio.play().catch(() => {});
  btnPlay.textContent = '⏸';
});

btnExit.addEventListener('click', () => {
  clearTimeout(endRevertTimer);
  audio.pause();
  audio.src = '';
  lines  = [];
  curIdx = -1;
  hasLRC = false;
  moon.style.opacity     = '0';
  btnPlay.textContent    = '▶';
  npActive.style.display = 'none';
  tvInner.style.display  = 'flex';
  viewTv.style.display   = 'none';
  viewMain.style.display = '';
  fetch('/karaoke/now', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ track: null, playing: false }),
  }).catch(() => {});
});

btnBack.addEventListener('click', () => btnExit.click());

audio.addEventListener('play',  () => { btnPlay.textContent = '⏸'; });
audio.addEventListener('pause', () => { btnPlay.textContent = '▶'; });
audio.addEventListener('ended', () => {
  btnPlay.textContent   = '▶';
  moon.style.opacity    = '0';
  lyrCurr.className     = 'lyr lyr-idle';
  lyrCurr.textContent   = '☽  fin';
  lyrPrev.textContent   = '';
  lyrNext.textContent   = '';
  peachK.classList.add('bark');
  setTimeout(() => peachK.classList.remove('bark'), 600);
  if (barkEnabled) playBark();
  endRevertTimer = setTimeout(() => {
    npActive.style.display = 'none';
    tvInner.style.display  = 'flex';
    viewTv.style.display   = 'none';
    viewMain.style.display = '';
  }, 700);
});

// ── Seek ───────────────────────────────────────────────────────────────────
function seekTo(e) {
  const r = progWrap.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  audio.currentTime = p * (audio.duration || 0);
  curIdx = -1;
}
progWrap.addEventListener('mousedown',  e => { seeking = true; seekTo(e); });
progWrap.addEventListener('touchstart', e => { seeking = true; seekTo(e.touches[0]); }, { passive: true });
document.addEventListener('mousemove',  e => { if (seeking) seekTo(e); });
document.addEventListener('touchmove',  e => { if (seeking) seekTo(e.touches[0]); }, { passive: true });
document.addEventListener('mouseup',    () => { seeking = false; });
document.addEventListener('touchend',   () => { seeking = false; });

// Keyboard
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); btnPlay.click(); }
  if (e.code === 'KeyR')  btnRst.click();
});

// ── Discover ──────────────────────────────────────────────────────────────
btnDisc.addEventListener('click', () => {
  const open = discPanel.style.display !== 'none';
  discPanel.style.display = open ? 'none' : '';
  btnDisc.textContent     = open ? '🔍 Discover' : '✕ Discover';
});

document.getElementById('disc-go').addEventListener('click', discoverSearch);
discQuery.addEventListener('keydown', e => { if (e.key === 'Enter') discoverSearch(); });

async function discoverSearch() {
  const q = discQuery.value.trim();
  discRes.innerHTML = '<div class="disc-msg">Searching…</div>';
  try {
    const url = '/karaoke/discover' + (q ? `?query=${encodeURIComponent(q)}&limit=8` : '?limit=8');
    const r = await fetch(url);
    const d = await r.json();
    if (!r.ok) {
      discRes.innerHTML = `<div class="disc-msg">⚠ ${d.detail || r.statusText}</div>`;
      return;
    }
    if (!d.tracks?.length) {
      discRes.innerHTML = '<div class="disc-msg">No results found</div>';
      return;
    }
    discRes.innerHTML = '';
    for (const t of d.tracks) discRes.appendChild(buildDiscCard(t));
  } catch {
    discRes.innerHTML = '<div class="disc-msg">Network error — is the server running?</div>';
  }
}

function buildDiscCard(t) {
  const card = document.createElement('div');
  card.className = 'disc-card';
  const dur = t.duration
    ? `${Math.floor(t.duration / 60)}:${String(Math.floor(t.duration % 60)).padStart(2, '0')}`
    : '';
  card.innerHTML = `
    <div class="disc-title">${t.name || '—'}</div>
    <div class="disc-meta">${t.artist_name || ''}${dur ? ' · ' + dur : ''}</div>
    <button class="btn-pull" data-id="${t.id}">▶ Pull &amp; Play</button>
  `;
  const pullBtn = card.querySelector('.btn-pull');
  pullBtn.addEventListener('click', async function () {
    this.disabled    = true;
    this.textContent = 'Pulling…';
    try {
      const r = await fetch('/karaoke/pull', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ track_id: String(t.id) }),
      });
      const d = await r.json();
      if (!r.ok) {
        this.disabled    = false;
        this.textContent = `✕ ${d.detail || 'Failed'}`;
        return;
      }
      this.textContent = '✓ Playing';
      const info   = d.track;
      const title  = info.attribution?.track_name  || humanize(info.name);
      const artist = info.attribution?.artist_name || '';
      // Reset + show player
      lines      = [];
      curIdx     = -1;
      hasLRC     = false;
      moon.style.opacity   = '0';
      npIdle.style.display   = 'none';
      npActive.style.display = 'flex';
      npLyrics.style.display = 'flex';
      npTitle.textContent  = title;
      npArtist.textContent = artist;
      lyrPrev.textContent  = '';
      lyrCurr.className    = 'lyr lyr-idle';
      lyrCurr.textContent  = '♪';
      lyrNext.textContent  = '';
      startAudio(info.name);
      loadLRC(info.name);
      fetch('/karaoke/now', {
        method:  'PUT',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ track: info.name, playing: true }),
      }).catch(() => {});
      // Prepend to library grid
      document.getElementById('track-grid').prepend(buildCard(info));
      // Close discover panel
      discPanel.style.display = 'none';
      btnDisc.textContent     = '🔍 Discover';
      viewMain.style.display = 'none';
      tvInner.style.display  = 'none';
      npActive.style.display = 'flex';
      viewTv.style.display   = 'flex';
    } catch {
      this.disabled    = false;
      this.textContent = '▶ Pull & Play';
    }
  });
  return card;
}

// ── TV MODE ───────────────────────────────────────────────────────────────
let tvLastTs    = 0;
let tvLastTrack = null;

function startTvPolling() {
  viewTv.style.display   = 'flex';
  viewMain.style.display = 'none';

  document.getElementById('tv-url').textContent =
    `${location.hostname}:${location.port || (location.protocol === 'https:' ? 443 : 80)}/karaoke`;

  document.getElementById('tv-activate').addEventListener('click', () => {
    document.getElementById('tv-activate').style.display = 'none';
    audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAA==';
    audio.play().catch(() => {});
  });

  pollTv();
}

async function pollTv() {
  try {
    const r = await fetch('/karaoke/now');
    if (r.ok) {
      const s = await r.json();
      if (s.track && s.ts > tvLastTs) {
        tvLastTs    = s.ts;
        tvLastTrack = s.track;
        document.getElementById('tv-status').textContent = `Now playing: ${humanize(s.track)}`;
        // np-active lives inside view-tv — keep view-tv visible, swap inner panels
        tvInner.style.display  = 'none';
        npActive.style.display = 'flex';
        npLyrics.style.display = 'flex';
        npTitle.textContent    = humanize(s.track);
        npArtist.textContent   = '';
        lines  = [];
        curIdx = -1;
        hasLRC = false;
        startAudio(s.track);
        loadLRC(s.track);
      } else if (!s.track && tvLastTrack) {
        tvLastTrack = null;
        audio.pause();
        audio.src = '';
        npActive.style.display = 'none';
        tvInner.style.display  = 'flex';
        document.getElementById('tv-status').textContent = 'Waiting for track…';
      }
    }
  } catch {}
  setTimeout(pollTv, 2000);
}

// ── Init ──────────────────────────────────────────────────────────────────
requestAnimationFrame(tick);

if (TV_MODE) {
  startTvPolling();
} else {
  initLibrary();
}
</script>
