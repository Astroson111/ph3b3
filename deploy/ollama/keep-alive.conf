# Ollama model residency — a RELIABILITY setting, not a memory one.
#
# The default is 5 minutes, not "forever". Raising it to 15 makes models stay
# resident LONGER, which is the opposite of what the 2026-08-23 incident brief
# assumed — Ollama was never the memory problem there. ComfyUI was, at 27.3 GB of
# host RAM against Ollama's 1.5 GB server process with zero models resident.
#
# The real reason to raise it: Morpheus' safety floor calls a judge on EVERY
# render (Layer B, unconditional). If the model has unloaded, that call pays a
# cold load against PH3B3_FLOOR_TIMEOUT (20s). When it loses that race the floor
# fails closed and returns 503 SafetyCheckUnavailable — a refusal the user reads
# as "it's broken". The same starvation made two test files flaky all through
# 2026-08-22 until they were stubbed.
#
# So this trades ~5 GB of resident RAM for fewer spurious safety-check failures.
# With 47 GB available after the ComfyUI restart, that is a good trade. Revisit
# if memory gets tight again — it is one number in one file.
[Service]
Environment="OLLAMA_KEEP_ALIVE=15m"
