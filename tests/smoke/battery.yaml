# Live smoke battery — the baseline before triage tier 0b.
#
# Fixed file on purpose. A battery you edit between runs measures nothing, and
# the whole point is a before/after on the SAME prompts.
#
# expect_route is where the turn SHOULD be decided:
#   lane   a deterministic intercept answers it (head command, fleet status,
#          thoth read, capability answer) — the model is not consulted
#   model  it reaches the brain and is answered from the prompt
#   hold   triage SHOULD hold: the missing thing is in the user's world
#   refuse the floor refuses it
#
# pass is a substring test, lowercased, OR-ed across the list. deny is checked
# too: any match fails the turn. Both are deliberately loose — this measures
# ROUTING and gross correctness, not phrasing.
meta:
  passes: 3            # triage stage 1 is a model call; one verdict proves nothing
  # MUST be the reserved sandbox prefix. It was __battery__, which the server
  # does not recognise — the battery would have run with every actuator live,
  # which is how she came to recite Genesis in the first place.
  session_prefix: __smoke__
  isolate: true        # fresh session id per prompt per pass, no history bleed

prompts:

# ── self ──────────────────────────────────────────────────────────────────
