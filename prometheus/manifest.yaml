# Prometheus — offline survival corpus manifest.
#
# DATA, not code. Same philosophy as moods.yaml and jokes.yaml: nothing enters
# the library without Astro's stamp, and the shelf is reviewable as a list.
#
# ── ON THE CHECKSUMS — READ THIS BEFORE FIRST FETCH ──────────────────────────
# Every `sha256` below is null. That is not an oversight and it is not safe yet.
#
# A checksum can only be computed by downloading the file, and fetch is the
# owner's action — never Phoebe's, never automatic. So the honest sequence is:
#
#   1. Astro reviews every `url` below. A wrong URL fetches the wrong document
#      and the checksum recorded from it would weld that mistake in permanently.
#   2. `./fetch.sh --record` downloads and WRITES the observed sha256 back here.
#      This is trust-on-first-use: it protects against later tampering, not
#      against a bad first download.
#   3. Astro reviews the recorded hashes and commits them.
#   4. From then on `./fetch.sh` verifies and refuses loudly on any mismatch.
#
# BETTER THAN TOFU, WHERE AVAILABLE: if a publisher posts a checksum file next
# to the artifact, put its URL in `sha256_url` and fetch.sh uses that as the
# expected value instead. That is an independent assertion made BEFORE we
# downloaded anything, so it catches a bad first fetch — which --record cannot.
# Kiwix does this for every ZIM. Most PDF publishers do not.
#
# Until step 3, this manifest asserts nothing about authenticity. `verified_url:
# false` marks entries whose URL I could not confirm; fetch.sh refuses to touch
# those without an explicit --accept-unverified. Do not paste hashes from
# anywhere but step 2 — a hash from a third party proves only that you match
# the third party.
#
# ── PRIORITY ──
# Medical questions consult priority 1 before anything else (the Triage Gate
# rule): Hesperian and Red Cross before Wikipedia, always.

version: 1
corpus_dir: corpus
index: index.db

# Sections excluded at INGEST — they never reach index.db, so retrieval cannot
# surface them even by accident. Matched against extracted headings,
# case-insensitively, as substrings. Reviewable on purpose: this list is the
# module's weapons policy, and it belongs in data where it can be read.
#
# The floor still runs on every output. This is defence in depth, not a
# replacement for it — a document that slips a weapons procedure under an
# innocuous heading is caught at answer time, not here.
blacklist_headings:
  - "improvised weapons"
  - "field-expedient weapons"
  - "weapons, field-expedient"
  - "booby trap"
  - "explosives"
  - "demolition"
  - "incendiar"          # incendiary / incendiaries
  - "poisons and their"  # FM 21-76's poison-preparation subsections
  - "expedient munitions"

# Tap-to-ask chips on the Prometheus tab. Six maximum, and the cap is the point:
# a wall of suggestions reads as a menu, and a menu implies the library answers
# only those things. Edit freely — `label` is the chip, `ask` is what gets asked.
quick_asks:
  - label: "Water"
    ask: "how do I make water safe to drink"
  - label: "Bleeding"
    ask: "how do I stop severe bleeding"
  - label: "Hypothermia"
    ask: "how do I treat hypothermia"
  - label: "Food preservation"
    ask: "how do I safely can food at home"
  - label: "Shelter"
    ask: "how do I build an emergency shelter"

sources:
  # REBUILT 2026-08-22 on Astro's rule: open-source or public-domain routes only,
  # and only repositories that publish direct files and expect mirroring.
  # Every url below was probed with curl and returned 200 application/pdf.
  # verified_url: true means I CONFIRMED THE CONTENT TYPE — not that I have read
  # the document. Confirm it is the right document before recording a checksum.

  # ── MEDICAL — priority 1, consulted first for anything clinical ────────────
  - id: army-first-aid
    name: "US Army FM 4-25.11 First Aid"
    category: medical
    priority: 1
    license: "US Government work — public domain"
    url: "https://archive.org/download/fm-4-25.11-first-aid/FM%204-25.11%20First%20Aid.pdf"
    path: "medical/army-fm-4-25-11-first-aid.pdf"
    sha256: 95fb01c941cdb385c152d045081ae011b59805931524e03192e953dc4e57af2f
    verified_url: true
    note: >
      Public domain by origin (US Army), so the archive.org item stating no
      licence does not matter here — a government work is public domain wherever
      it is hosted. This is now the ONLY clinical reference on the shelf; the
      Hesperian books were dropped with the open-repositories-only rule, and
      re-adding them means fetching from hesperian.org, which curl reaches fine.

  # ── SHELTER / GENERAL SURVIVAL ────────────────────────────────────────────
  # fm-21-76 REMOVED 2026-08-22 at Astro's call. It is legal, public domain and
  # ordinary to own, but it carries improvised-weapons and booby-trap chapters,
  # and the cleaner answer to "a document that needs a blacklist" is a document
  # that does not need one. FEMA's Are You Ready? covers the civilian shelter and
  # preparedness ground without that content.
  #
  # The blacklist STAYS regardless — it is defence in depth for whatever gets
  # added later, not a patch for one specific book.

  - id: fema-ready
    name: "FEMA — Are You Ready? A Guide to Citizen Preparedness"
    category: general
    priority: 2
    license: "US Government work — public domain (item states CC public domain)"
    url: "https://archive.org/download/FemaEmergencyHandbook-areYouReady/FemaEmergencyHandbook-areYouReady.pdf"
    path: "general/fema-are-you-ready.pdf"
    sha256: 0d06472d035309aba015a830376da19f01e1ed6a5a3b87cc0ad346ea7cb67e4d
    verified_url: true
    note: "fema.gov itself returns 403 to non-browser agents; archive.org serves it directly."

  # ── COMMS ─────────────────────────────────────────────────────────────────
  - id: fcc-part97
    name: "FCC Part 97 — Amateur Radio Service (47 CFR Part 97)"
    category: comms
    priority: 2
    license: "US Government work (govinfo) — public domain"
    url: "https://www.govinfo.gov/content/pkg/CFR-2024-title47-vol5/pdf/CFR-2024-title47-vol5-part97.pdf"
    path: "comms/fcc-part-97.pdf"
    sha256: 144b9fa5ecbb4fdbf960c9ef5512cec5ceee015be57417bc0ed17e2bd1d91618
    verified_url: true
    note: >
      The actual regulation rather than the ARRL band plan, which is ARRL
      copyright. In an emergency the legal allocations matter more than the
      voluntary courtesy plan. Bump the year in the URL to update.

  # ── STILL NEEDED — no verified open route yet ─────────────────────────────
  - id: plants-midatlantic
    name: "Edible and poisonous plants — Mid-Atlantic / Eastern woodlands"
    category: plants
    priority: 1
    license: "MUST be public domain or openly licensed"
    url: ""
    path: "plants/mid-atlantic-plants.pdf"
    sha256: null
    verified_url: false
    note: >
      STILL UNFILLED and I could not fix it: I found no public-domain
      Mid-Atlantic edible/poisonous plant field guide. What archive.org has are
      copyrighted field guides (Peterson, Tom Brown) which fail the rule, and
      regional government publications for the wrong regions — Canada, Idaho.
      USDA NRCS publishes per-species plant guides that are public domain, but
      they are fact sheets, not an identification key.

      Astro selects this personally. A bad plant guide is the most dangerous
      document that could go on this shelf — a misidentified plant kills where a
      wrong knot does not. Until it is filled in, regional plant questions fall
      back to usaf-survival's general principles, which is honest but thin.

  - id: water-treatment
    name: "TB MED 577 — Sanitary Control and Surveillance of Field Water Supplies"
    category: water
    priority: 1
    license: "US Government work (US Army) — public domain"
    url: "https://archive.org/download/ost-military-medical-tbmed577/tbmed577.pdf"
    path: "water/tb-med-577-field-water.pdf"
    sha256: c6545d275891af9b1204bcc4c6e924250e03579578fd29acc847bd0a66986df7
    verified_url: true
    note: >
      REPLACES the CDC page, which is served as HTML and does not drop into a PDF
      corpus. This is more thorough than the CDC guidance anyway — disinfection
      chemistry, contact times, and field testing — and it is public domain.

  - id: usda-canning
    name: "USDA Complete Guide to Home Canning (2015 revision)"
    category: food
    priority: 1
    license: "US Government work (USDA) — public domain"
    url: "https://archive.org/download/usda-guide-home-canning/USDA-Complete-Guide-to-Home-Canning-2015-revision.pdf"
    path: "food/usda-complete-guide-home-canning.pdf"
    sha256: 82014af73d1d5283ed1a711f7d0940e72a7ea9a10d0c0c4551bc79a1f4092028
    verified_url: true
    note: >
      The single-volume 2015 revision, 16.5 MB — not the seven separate guides
      nchfp.uga.edu publishes. Creator is USDA, so public domain by origin
      whatever the archive.org item says about licence.

  # usaf-survival REMOVED 2026-08-22, same call as fm-21-76 and for consistency
  # with it: AFR 64-4 is a Survival, EVASION and ESCAPE manual. It was added for
  # its edible-plants material, but keeping one manual of that class while
  # removing the other was not a coherent line.
  #
  # What it cost: general plant principles — the Universal Edibility Test,
  # families to avoid. It could not identify a single Mid-Atlantic species, so
  # plant questions now answer "that's not in the library" until a real regional
  # guide is chosen. That is thinner, and on the one topic where being wrong
  # kills someone, thin-and-honest beats broad-and-vague.

# ── KIWIX ZIMs ───────────────────────────────────────────────────────────────
# Not ingested into FTS5 — they are served by kiwix-serve on localhost and linked.
# REQUIRES `apt install kiwix-tools`, which is NOT currently installed on Nyx.
zims:
  - id: wikimed
    name: "WikiMed — Wikipedia medical subset"
    license: "CC BY-SA (Wikipedia) — free/open"
    category: medical
    priority: 1
    size_hint: "2.1 GB"
    sha256_url: "https://download.kiwix.org/zim/wikipedia/wikipedia_en_medicine_maxi_2026-04.zim.sha256"          # Kiwix publishes <file>.sha256 beside each ZIM — confirm exact path
    url: "https://download.kiwix.org/zim/wikipedia/wikipedia_en_medicine_maxi_2026-04.zim"
    path: "zim/wikipedia_en_medicine_maxi_2026-04.zim"
    sha256: null
    verified_url: true
    rhea_backup: true

  # wikihow REMOVED: https://download.kiwix.org/zim/wikihow/ returns 404 — there
  # is no such category on the mirror, so the entry pointed at nothing.

  - id: ifixit
    name: "iFixit repair guides"
    category: general
    priority: 3
    license: "CC BY-NC-SA (iFixit) — open but NON-COMMERCIAL"
    size_hint: "~2 GB"
    sha256_url: "https://download.kiwix.org/zim/ifixit/ifixit_en_all_2025-12.zim.sha256"
    url: "https://download.kiwix.org/zim/ifixit/ifixit_en_all_2025-12.zim"
    path: "zim/ifixit_en_all_2025-12.zim"
    sha256: null
    verified_url: true
    rhea_backup: true

  - id: wikipedia-full
    name: "Wikipedia (full, no images)"
    license: "CC BY-SA (Wikipedia) — free/open"
    category: general
    priority: 4
    size_hint: "~49 GB — measured, not the 20 GB the brief assumed"
    sha256_url: "https://download.kiwix.org/zim/wikipedia/wikipedia_en_all_nopic_2026-06.zim.sha256"          # Kiwix publishes <file>.sha256 beside each ZIM — confirm exact path
    url: "https://download.kiwix.org/zim/wikipedia/wikipedia_en_all_nopic_2026-06.zim"
    path: "zim/wikipedia_en_all_nopic_2026-06.zim"
    sha256: null
    verified_url: true
    # Astro's call, 2026-08-22: keep it on disk, keep it OUT of the nightly
    # backup. It is the one item genuinely re-fetchable from a public mirror,
    # and 20 GB in restic would push the Rhea drive toward the 80% mark Argus
    # warns on. rhea-backup.sh carries a matching --exclude.
    rhea_backup: false
