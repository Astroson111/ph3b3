[pytest]
# The floor probes are named <area>_probe.py, not test_*.py, so pytest's default
# discovery skipped every one of them. `pytest tests/` collected ZERO items from
# 151 adversarial safety cases and exited 0 — which reads as a pass, and did, for
# about a month. A commit in August claimed to have fixed this; it did not, and
# nothing checked, because the symptom of the bug is a green run.
#
# tests/test_floor_manifest.py now asserts collection actually happens, so this
# line cannot silently stop working again.
python_files = test_*.py *_probe.py

# Live smoke tests talk to the RUNNING service and the local judge. They skip
# cleanly when either is down, so `pytest tests/` on a dev box stays green, but
# they are the only thing that catches a config change which silently breaks her
# self-knowledge — a failure whose symptom is a perfectly polite wrong answer.
markers =
    smoke: needs the running ph3b3 service and ollama; skips cleanly without them
