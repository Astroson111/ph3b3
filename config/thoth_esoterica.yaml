# ── Thoth Rung 5: Western esoterica ──────────────────────────────────────────
# NOT YET MERGED into thoth_corpus.yaml. Kept separate so Rungs 1-4 cannot be
# disturbed by an edit here, and so merging is a deliberate act rather than a
# side effect of drafting.
#
# Every entry below was pinned on 2026-09-18 by:
#   1. searching archive.org for the work
#   2. fetching https://archive.org/metadata/<id> for each candidate
#   3. running thoth.source_policy.archive_item_ok() on it — which refuses
#      access-restricted items, the printdisabled/inlibrary/internetarchivebooks
#      lending shelves, and anything not marked NOT_IN_COPYRIGHT (silence included)
#   4. recording the identifier, the exact _djvu.txt file, its sha1 and its size
#      from the metadata, so the download can be verified without having been
#      made yet
#
# Requests were serialised 2s apart with a contact address in the User-Agent,
# per archive.org's own guidance. A 429 would have stopped the run; none occurred.
#
# THREE WORKS WERE SOUGHT AND REFUSED, and are dropped rather than recorded as
# gaps, per the Rung 1 rule:
#   Key of Solomon (Mathers)      every candidate was a lending or modern edition
#   Pictorial Key (Waite)         every candidate was access-restricted; the one
#                                 freely downloadable copy on Gutenberg is
#                                 de Laurence's plagiarism and is refused by id
#   Goetia (Mathers/Crowley)      same as Key of Solomon
#
# EDITIONS DIFFER FROM THE BRIEF in three places, recorded rather than smoothed:
# the brief named Westcott 1887, Mathers 1887 and Freake 1651; what is actually
# available and clean is 1893, 1912 and Whitehead 1898. The last is not a
# reprint but a different edition, and is flagged as such below.

