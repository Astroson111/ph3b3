# Ph3b3 voice + language registry.
#
# Only INSTALLED, TESTED Piper models appear here — the honest-gap rule: a
# language with no good native voice must NOT get an entry (it falls back to Alba
# + a spoken note, never a wrong-accent read presented as native).
#
# Alba (en) is Phoebe's INVARIANT voice — it is an entry here, chosen by the
# selector, but its model/config is NEVER edited. Models live in
# ~/ph3b3_data/voices/ (downloaded once by setup.sh; zero runtime network fetches).
#
# Fields:
#   model        — filename in ~/ph3b3_data/voices/
#   lang         — the response-language this voice pairs with (a key in
#                  LANG_NAMES). Multiple voices may serve one language
#                  (e.g. es_ES + es_MX both serve 'es'); the entry whose id
#                  equals the lang code is that language's primary.
#   display_name — shown in the picker (native name + language)
#   script       — 'latin' (safe to strip for Piper) | 'native' (pass through; the
#                  voice's own model handles its script — never strip it)
#   tier         — 'strong' | 'functional'  (honest-capability note in the UI: small
#                  local models vary in fluency by language)
#   sample_text  — REQUIRED. One short line IN THE VOICE'S OWN LANGUAGE, spoken
#                  by Preview ("Hello! I'm Phoebe." and its translations). A voice
#                  with no sample_text fails the synthesis check (it cannot be
#                  previewed or approved) rather than emitting silence.
#   status       — 'approved' | 'unreviewed'  (the review GATE, below)
#
# REVIEW GATE
#   Only status: approved voices appear in the portal Voice dropdown. An
#   unreviewed voice is installed and synth-checked but reachable ONLY through
#   the Status-tab review flow (preview + approve/reject). Approving is the
#   Captain's call, by ear — it is never set here for a new voice by tooling.
#   The runtime decision (approve/reject) is persisted OUTSIDE this file, in
#   ~/ph3b3_data/voice_review.json, so this repo config stays immutable; a reject
#   also deletes the model from disk. The status: here is the SEED default.
#   The five voices below were seated before the gate existed → grandfathered
#   approved.

default: en          # Phoebe's default primary voice = Alba

voices:
  en:
    model: en_GB-alba-medium.onnx
    lang: en
    display_name: "Alba — English (Scottish)"
    script: latin
    tier: strong
    sample_text: "Hello! I'm Phoebe."
    status: approved
  es:
    model: es_ES-davefx-medium.onnx
    lang: es
    display_name: "Español (España)"
    script: latin
    tier: strong
    sample_text: "¡Hola! Soy Phoebe."
    status: approved
  fr:
    model: fr_FR-siwis-medium.onnx
    lang: fr
    display_name: "Français (France)"
    script: latin
    tier: strong
    sample_text: "Bonjour ! Je suis Phoebe."
    status: approved
  de:
    model: de_DE-thorsten-medium.onnx
    lang: de
    display_name: "Deutsch (Deutschland)"
    script: latin
    tier: strong
    sample_text: "Hallo! Ich bin Phoebe."
    status: approved
  zh:
    model: zh_CN-huayan-medium.onnx
    lang: zh
    display_name: "中文 (普通话) — Mandarin"
    script: native
    tier: functional
    sample_text: "你好！我是 Phoebe。"
    status: approved

  # ── Candidates awaiting the Captain's ear (status: unreviewed) ───────────────
  # Installed + synth-checked, but absent from the main Voice dropdown until
  # approved in the Status-tab review flow.
  es_MX:
    model: es_MX-ald-medium.onnx
    lang: es
    display_name: "Español (México)"
    script: latin
    tier: functional
    sample_text: "¡Hola! Soy Phoebe."
    status: unreviewed
  es_sharvard:
    model: es_ES-sharvard-medium.onnx
    lang: es
    display_name: "Español (España) — Sharvard"
    script: latin
    tier: strong
    sample_text: "¡Hola! Soy Phoebe."
    status: unreviewed
  es_MX_high:
    model: es_MX-claude-high.onnx
    lang: es
    display_name: "Español (México) — alta calidad"
    script: latin
    tier: strong
    sample_text: "¡Hola! Soy Phoebe."
    status: unreviewed
  de_high:
    model: de_DE-thorsten-high.onnx
    lang: de
    display_name: "Deutsch (Deutschland) — hohe Qualität"
    script: latin
    tier: strong
    sample_text: "Hallo! Ich bin Phoebe."
    status: unreviewed
# Roster note: the ticket's it_IT / pt_BR / ru_RU / pl_PL voices are intentionally
# NOT installed — those languages are not in the LANGUAGE picker (LANG_NAMES), so a
# voice for them would be unreachable. fr_FR-siwis-medium is already the seated fr
# primary above. Install a language's voice only when the language is offered.
