# Ph3b3 voice + language registry.
#
# Only INSTALLED, TESTED Piper models appear here — the honest-gap rule: a
# language with no good native voice must NOT get an entry (it falls back to Alba
# + a spoken note, never a wrong-accent read presented as native).
#
# Alba (en) is Phoebe's INVARIANT voice — it is an entry here, chosen by the
# selector, but its model/config is NEVER edited. Models live in
# ~/ph3b3_data/voices/ (downloaded once by setup.sh; zero runtime network fetches).
#
# Fields:
#   model        — filename in ~/ph3b3_data/voices/
#   lang         — the response-language this voice pairs with (a key in
#                  LANG_NAMES). Multiple voices may serve one language
#                  (e.g. es_ES + es_MX both serve 'es'); the entry whose id
#                  equals the lang code is that language's primary.
#   display_name — REQUIRED. Shown everywhere a voice appears (picker, "Speaking
#                  with:" banner, review flow). Format: "<Name> — <Language>
#                  (<Region/accent>)" where Name is the voice's dataset name,
#                  capitalized — Alba's colleagues, by name (e.g. "Sharvard —
#                  Español (España)"). A voice with no display_name fails the
#                  install synth check rather than rendering a raw model id.
#   script       — 'latin' (safe to strip for Piper) | 'native' (pass through; the
#                  voice's own model handles its script — never strip it)
#   tier         — 'strong' | 'functional'  (honest-capability note in the UI: small
#                  local models vary in fluency by language)
#   sample_text  — REQUIRED. One short line IN THE VOICE'S OWN LANGUAGE, spoken
#                  by Preview ("Hello! I'm Phoebe." and its translations). A voice
#                  with no sample_text fails the synthesis check (it cannot be
#                  previewed or approved) rather than emitting silence.
#   status       — 'approved' | 'unreviewed'  (the review GATE, below)
#
# REVIEW GATE
#   Only status: approved voices appear in the portal Voice dropdown. An
#   unreviewed voice is installed and synth-checked but reachable ONLY through
#   the Status-tab review flow (preview + approve/reject). Approving is the
#   Captain's call, by ear — it is never set here for a new voice by tooling.
#   The runtime decision (approve/reject) is persisted OUTSIDE this file, in
#   ~/ph3b3_data/voice_review.json, so this repo config stays immutable; a reject
#   also deletes the model from disk. The status: here is the SEED default.
#   The five voices below were seated before the gate existed → grandfathered
#   approved.

default: en          # Phoebe's default primary voice = Alba

voices:
  en:
    model: en_GB-alba-medium.onnx
    lang: en
    display_name: "Alba — English (Scottish)"
    script: latin
    tier: strong
    sample_text: "Hello! I'm Phoebe."
    status: approved
  es:
    model: es_ES-davefx-medium.onnx
    lang: es
    display_name: "Davefx — Español (España)"
    script: latin
    tier: strong
    sample_text: "¡Hola! Soy Phoebe."
    status: approved
  fr:
    model: fr_FR-siwis-medium.onnx
    lang: fr
    display_name: "Siwis — Français (France)"
    script: latin
    tier: strong
    sample_text: "Bonjour ! Je suis Phoebe."
    status: approved
  de:
    model: de_DE-thorsten-medium.onnx
    lang: de
    display_name: "Thorsten — Deutsch (Deutschland)"
    script: latin
    tier: strong
    sample_text: "Hallo! Ich bin Phoebe."
    status: approved
  zh:
    model: zh_CN-huayan-medium.onnx
    lang: zh
    display_name: "Huayan — 中文 (普通话)"
    script: native
    tier: functional
    sample_text: "你好！我是 Phoebe。"
    status: approved

  # ── Additional voices, Captain-approved by ear (status: approved) ────────────
  # Seated in the picker for their language. New candidates added here should
  # ship as `status: unreviewed` and be approved via the Status-tab review flow;
  # these were reviewed and promoted.
  es_MX:
    model: es_MX-ald-medium.onnx
    lang: es
    display_name: "Ald — Español (México)"
    script: latin
    tier: functional
    sample_text: "¡Hola! Soy Phoebe."
    status: approved
  es_sharvard:
    model: es_ES-sharvard-medium.onnx
    lang: es
    display_name: "Sharvard — Español (España)"
    script: latin
    tier: strong
    sample_text: "¡Hola! Soy Phoebe."
    status: approved
  es_MX_high:
    model: es_MX-claude-high.onnx
    lang: es
    display_name: "Claude — Español (México)"
    script: latin
    tier: strong
    sample_text: "¡Hola! Soy Phoebe."
    status: approved
  de_high:
    model: de_DE-thorsten-high.onnx
    lang: de
    display_name: "Thorsten HD — Deutsch (Deutschland)"
    script: latin
    tier: strong
    sample_text: "Hallo! Ich bin Phoebe."
    status: approved

  # ── Bench expansion: it / pl / ru (Captain-approved by ear) ──────────────────
  # Reviewed and promoted; their languages are voiced. New candidates should still
  # ship as `status: unreviewed` and be approved via the Status-tab review flow.
  it:
    model: it_IT-paola-medium.onnx
    lang: it
    display_name: "Paola — Italiano (Italia)"
    script: latin
    tier: strong
    sample_text: "Ciao! Sono Phoebe."
    status: approved
  pl:
    model: pl_PL-gosia-medium.onnx
    lang: pl
    display_name: "Gosia — Polski (Polska)"
    script: latin
    tier: strong
    sample_text: "Cześć! Jestem Phoebe."
    status: approved
  ru:
    model: ru_RU-irina-medium.onnx
    lang: ru
    display_name: "Irina — Русский (Россия)"
    script: native          # Cyrillic — never strip to Latin (would delete the text)
    tier: strong
    sample_text: "Привет! Я Фиби."
    status: approved

  # ── Popular-language expansion (Captain-approved by ear) ─────────────────────
  # Reviewed and promoted; their languages are voiced. Arabic is the first RTL
  # language (script: native). New candidates still ship `status: unreviewed`.
  vi:
    model: vi_VN-vais1000-medium.onnx
    lang: vi
    display_name: "Vais1000 — Tiếng Việt (Việt Nam)"
    script: latin           # Vietnamese tone marks live in Latin Extended — safe
    tier: strong
    sample_text: "Xin chào! Tôi là Phoebe."
    status: approved
  ar:
    model: ar_JO-kareem-medium.onnx
    lang: ar
    display_name: "Kareem — العربية (الأردن)"
    script: native          # Arabic (RTL) — never strip to Latin (would delete the text)
    tier: strong
    sample_text: "مرحباً! أنا فيبي."
    status: approved
  tr:
    model: tr_TR-dfki-medium.onnx
    lang: tr
    display_name: "DFKI — Türkçe (Türkiye)"
    script: latin
    tier: strong
    sample_text: "Merhaba! Ben Phoebe."
    status: approved
  nl:
    model: nl_NL-pim-medium.onnx
    lang: nl
    display_name: "Pim — Nederlands (Nederland)"
    script: latin
    tier: strong
    sample_text: "Hallo! Ik ben Phoebe."
    status: approved
  uk:
    model: uk_UA-ukrainian_tts-medium.onnx
    lang: uk
    display_name: "Ukrainian TTS — Українська (Україна)"
    script: native          # Cyrillic — never strip to Latin
    tier: strong
    sample_text: "Привіт! Я Фібі."
    status: approved
  cs:
    model: cs_CZ-jirka-medium.onnx
    lang: cs
    display_name: "Jirka — Čeština (Česko)"
    script: latin
    tier: strong
    sample_text: "Ahoj! Jsem Phoebe."
    status: approved
  sv:
    model: sv_SE-nst-medium.onnx
    lang: sv
    display_name: "NST — Svenska (Sverige)"
    script: latin
    tier: strong
    sample_text: "Hej! Jag är Phoebe."
    status: approved
# Roster note: pt_BR is intentionally NOT installed — Portuguese is not in the
# LANGUAGE picker (LANG_NAMES), so a voice for it would be unreachable. Install a
# language's voice only when the language is offered. Japanese / Korean / Hindi /
# Indonesian are offered TEXT-ONLY: official Piper has no voice clearing the bar
# for them (see FUTURE_GOALS). Dutch: pim chosen over the brief's mls suggestion
# (cleaner single-speaker) — a flagged substitution.

  # ── English alternatives to Alba (unreviewed) ──────────────────────────────
  # Alba stays the invariant primary: her id is the lang code, her model is never
  # edited, and she remains the fallback for every voiceless language. These are
  # additions beside her, not replacements.
  #
  # Added because English had exactly ONE voice while Spanish had four, so the
  # picker had nothing to offer anyone who found Alba hard to listen to — the
  # selector was never missing, the choice was.
  #
  # Three deliberately different axes rather than three of the same thing: a male
  # voice (different pitch entirely), a neutral US female (no accent to decode),
  # and a softer British female (same family as Alba, gentler delivery). Whichever
  # quality is the trigger, one of these changes it.
  #
  # status: unreviewed on purpose — approving is by ear, in the Status tab, and is
  # not a thing tooling decides.
  en_ryan:
    model: en_US-ryan-high.onnx
    lang: en
    display_name: "Ryan — English (United States)"
    script: latin
    tier: strong
    sample_text: "Hello! I'm Phoebe."
    status: unreviewed
  en_lessac:
    model: en_US-lessac-high.onnx
    lang: en
    display_name: "Lessac — English (United States)"
    script: latin
    tier: strong
    sample_text: "Hello! I'm Phoebe."
    status: unreviewed
  # Cori — added 2026-09-15. Two voices were briefed alongside her and BOTH were
  # dropped on licence, by Astro's call ("lets just use what is public domain"):
  #   amy  — MODEL_CARD says "License: See URL" pointing at MycroftAI/mimic3-voices,
  #          which is CC BY-SA 4.0 at the root and does not contain an amy voice at
  #          all. Provenance broken, and not public domain either way.
  #   alan — sourced from mimic3 en_UK/apope, whose own LICENSE reads
  #          "Copyright 2022 Mycroft AI / All Rights Reserved". Not open at all.
  # Cori is the one with a real grant: trained from scratch on ~24h of LibriVox
  # recordings, which the MODEL_CARD states as public domain.
  en_cori:
    model: en_GB-cori-high.onnx
    lang: en
    display_name: "Cori — English (Great Britain)"
    script: latin
    tier: strong
    sample_text: "Hello! I'm Phoebe."
    status: unreviewed

  en_jenny:
    model: en_GB-jenny_dioco-medium.onnx
    lang: en
    display_name: "Jenny — English (England)"
    script: latin
    tier: strong
    sample_text: "Hello! I'm Phoebe."
    status: unreviewed
